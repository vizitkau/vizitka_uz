<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azizov Akbar | NFC Business Card</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.25), transparent 32%),
        radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.10), transparent 28%),
        linear-gradient(135deg, #030303, #111, #050505);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .profile,
    .actions {
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
      padding: 34px;
    }

    .profile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.13);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #f6dc82;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar {
      width: 118px;
      height: 118px;
      margin-top: 34px;
      border-radius: 32px;
      background: linear-gradient(135deg, #d4af37, #fff3ad);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 0 45px rgba(212, 175, 55, 0.38);
    }

    h1 {
      margin: 28px 0 8px;
      font-size: 42px;
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #c9c9c9;
      font-size: 16px;
      line-height: 1.6;
      max-width: 360px;
    }

    .number {
      margin-top: 28px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: #ddd;
      font-size: 15px;
      border: 1px solid rgba(255,255,255,0.09);
    }

    .actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 22px;
      color: #f5d76e;
    }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 17px 18px;
      margin: 11px 0;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 650;
      transition: 0.25s ease;
      font-family: inherit;
    }

    .btn i {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f4d46b;
      font-size: 20px;
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: rgba(212,175,55,0.7);
      background: rgba(255,255,255,0.14);
    }

    .main {
      background: linear-gradient(135deg, #d4af37, #fff1a6);
      color: #111;
      border: none;
    }

    .main i {
      color: #111;
    }

    button {
      cursor: pointer;
      text-align: left;
    }

    .brand {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #9f9f9f;
    }

    .brand a {
      color: #f5d76e;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      body {
        padding: 18px;
        align-items: flex-start;
      }

      .wrapper {
        grid-template-columns: 1fr;
        max-width: 430px;
      }

      .profile,
      .actions {
        padding: 26px 20px;
        border-radius: 28px;
      }

      .profile {
        min-height: auto;
      }

      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 26px;
        font-size: 34px;
        margin-top: 26px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 15px;
      }

      .btn {
        padding: 15px 16px;
        border-radius: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="wrapper">

    <section class="profile">
      <div>
        <div class="badge">
          <i class="fa-solid fa-nfc-symbol"></i>
          NFC Digital Card
        </div>

        <div class="avatar">AA</div>

        <h1>Azizov<br>Akbar</h1>

        <div class="subtitle">
          Zamonaviy raqamli vizitka. Kontakt, ijtimoiy tarmoqlar va karta ma’lumotlari bitta sahifada.
        </div>

        <div class="number">
          <i class="fa-solid fa-phone"></i>
          +998 90 610 06 36
        </div>
      </div>
    </section>

    <section class="actions">
      <h2 class="section-title">Kontaktlar</h2>

      <a class="btn main" href="tel:+998906100636">
        <i class="fa-solid fa-phone"></i>
        Qo‘ng‘iroq qilish
      </a>

      <a class="btn" href="https://wa.me/998906100636" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        WhatsApp
      </a>

      <a class="btn" href="https://t.me/Akkbar611" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        Telegram
      </a>

      <a class="btn" href="https://instagram.com/111_.cosmos" target="_blank">
        <i class="fa-brands fa-instagram"></i>
        Instagram
      </a>

      <button class="btn" onclick="copyCard()">
        <i class="fa-solid fa-credit-card"></i>
        Karta raqamini nusxalash
      </button>

      <button class="btn" onclick="saveContact()">
        <i class="fa-solid fa-address-book"></i>
        Kontaktni saqlash
      </button>

      <div class="brand">
        Made by <a href="https://instagram.com/vizitka_uz" target="_blank">@vizitka_uz</a>
      </div>
    </section>

  </main>

  <script>
    function copyCard() {
      navigator.clipboard.writeText("5440810309065703");
      alert("Karta raqami nusxalandi");
    }

    function saveContact() {
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Azizov Akbar
TEL:+998906100636
URL:https://instagram.com/111_.cosmos
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Azizov_Akbar.vcf";
      link.click();
    }
  </script>

</body>
</html>
