<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azizov Akbar | NFC Card</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(212,175,55,.25), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,255,255,.08), transparent 30%),
    #050505;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:1100px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.left,
.right{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(212,175,55,.25);
  backdrop-filter:blur(20px);
  border-radius:35px;
  overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.left{
  position:relative;
  min-height:650px;
  padding:35px;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.8)),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80");
  background-size:cover;
  background-position:center;
}

.badge{
  position:absolute;
  top:25px;
  right:25px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(212,175,55,.5);
  color:#f4d46b;
  padding:10px 18px;
  border-radius:30px;
  font-size:13px;
  font-weight:600;
}

.logo{
  width:95px;
  height:95px;
  border-radius:25px;
  background:linear-gradient(135deg,#d4af37,#fff2a6);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#111;
  font-size:38px;
  font-weight:900;
  margin-top:130px;
}

h1{
  margin-top:35px;
  font-size:58px;
  line-height:.95;
}

h1 span{
  color:#d4af37;
}

.desc{
  margin-top:15px;
  color:#d8d8d8;
  font-size:18px;
  line-height:1.6;
}

.features{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:30px;
}

.features div{
  background:rgba(255,255,255,.08);
  padding:10px 15px;
  border-radius:15px;
  font-size:14px;
}

.features i{
  color:#d4af37;
}

.phonebox{
  margin-top:35px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:15px;
}

.phonebox i{
  width:55px;
  height:55px;
  background:rgba(212,175,55,.15);
  color:#d4af37;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
}

.right{
  padding:30px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-size:24px;
  margin-bottom:15px;
  color:#f4d46b;
}

.btn{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px;
  border-radius:22px;
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  margin:10px 0;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-3px);
  border-color:#d4af37;
}

.icon{
  width:55px;
  height:55px;
  border-radius:15px;
  background:rgba(212,175,55,.15);
  color:#f4d46b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.btn small{
  color:#aaa;
  display:block;
  margin-top:4px;
}

.arrow{
  margin-left:auto;
  color:#888;
}

.gold{
  background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(255,255,255,.08));
}

button{
  width:100%;
  text-align:left;
  border:none;
  cursor:pointer;
  font-family:inherit;
}

.brand{
  text-align:center;
  margin-top:15px;
  font-size:11px;
  color:#777;
}

.brand a{
  color:#999;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
}

.brand i{
  color:#d4af37;
}

@media(max-width:850px){
  .container{
    grid-template-columns:1fr;
    max-width:450px;
  }

  .left{
    min-height:550px;
  }

  .logo{
    margin-top:100px;
  }

  h1{
    font-size:42px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="left">

    <div class="badge">
      <i class="fa-solid fa-wifi"></i> NFC CARD
    </div>

    <div class="logo">AA</div>

    <h1>Azizov<br><span>Akbar</span></h1>

    <div class="desc">
      Premium Digital Business Card
    </div>

    <div class="features">
      <div><i class="fa-solid fa-shield"></i> Ishonchlilik</div>
      <div><i class="fa-solid fa-bolt"></i> Tezkor</div>
      <div><i class="fa-solid fa-lock"></i> Xavfsiz</div>
    </div>

    <div class="phonebox">
      <i class="fa-solid fa-phone"></i>
      <div>
        <b>+998 90 610 06 36</b><br>
        <span style="color:#aaa">Telefon raqamim</span>
      </div>
    </div>

  </div>

  <div class="right">

    <div class="title">Kontaktlar</div>

    <a class="btn gold" href="tel:+998906100636">
      <div class="icon">
        <i class="fa-solid fa-phone"></i>
      </div>
      <div>
        Qo‘ng‘iroq qilish
        <small>Bir bosishda qo‘ng‘iroq</small>
      </div>
      <i class="fa-solid fa-chevron-right arrow"></i>
    </a>

    <a class="btn" href="https://t.me/Akkbar611" target="_blank">
      <div class="icon">
        <i class="fa-brands fa-telegram"></i>
      </div>
      <div>
        Telegram
        <small>@Akkbar611</small>
      </div>
      <i class="fa-solid fa-chevron-right arrow"></i>
    </a>

    <a class="btn" href="https://instagram.com/111_.cosmos" target="_blank">
      <div class="icon">
        <i class="fa-brands fa-instagram"></i>
      </div>
      <div>
        Instagram
        <small>@111_.cosmos</small>
      </div>
      <i class="fa-solid fa-chevron-right arrow"></i>
    </a>

    <button class="btn" onclick="copyCard()">
      <div class="icon">
        <i class="fa-solid fa-credit-card"></i>
      </div>
      <div>
        Karta raqamim
        <small>5440 8103 0906 5703</small>
      </div>
      <i class="fa-regular fa-copy arrow"></i>
    </button>

    <button class="btn" onclick="saveContact()">
      <div class="icon">
        <i class="fa-solid fa-address-book"></i>
      </div>
      <div>
        Kontaktimni saqlash
        <small>Telefoningizga qo‘shing</small>
      </div>
      <i class="fa-solid fa-chevron-right arrow"></i>
    </button>

    <div class="brand">
      Made by
      <a href="https://instagram.com/vizitka_uz" target="_blank">
        <i class="fa-brands fa-instagram"></i> @vizitka_uz
      </a>
    </div>

  </div>

</div>

<script>
function copyCard(){
  navigator.clipboard.writeText("5440810309065703");
  alert("Karta raqami nusxalandi");
}

function saveContact(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Azizov Akbar
TEL:+998906100636
URL:https://instagram.com/111_.cosmos
END:VCARD`;

  const blob = new Blob([vcard], {type:"text/vcard"});
  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "Azizov_Akbar.vcf";
  link.click();
}
</script>

</body>
</html>
