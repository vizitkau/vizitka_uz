<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azizov Akbar</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #070707, #171717);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.7);
      text-align: center;
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #fff2a8);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #f5d76e;
    }

    .subtitle {
      margin: 8px 0 26px;
      color: #bdbdbd;
      font-size: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 15px 17px;
      margin: 12px 0;
      border-radius: 16px;
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.25s;
    }

    .btn i {
      width: 24px;
      color: #f5d76e;
      font-size: 20px;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #2b2b2b;
      border-color: #d4af37;
    }

    .gold {
      background: linear-gradient(135deg, #d4af37, #fff2a8);
      color: #111;
    }

    .gold i {
      color: #111;
    }

    button {
      cursor: pointer;
      border: none;
      text-align: left;
    }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #777;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Azizov Akbar</h1>
    <div class="subtitle">Digital Business Card</div>

    <a class="btn gold" href="tel:+998906100636">

    <a class="btn" href="https://t.me/Akkbar611" target="_blank">

    </a>

    <a class="btn" href="https://instagram.com/111_.cosmos" target="_blank">
      <i class="fa-brands fa-instagram"></i>
      Instagram
    </a>

    <button class="btn" onclick="copyCard()">
      <i class="fa-solid fa-credit-card"></i>

      <i class="fa-solid fa-address-card"></i>

    </a>

    <div class="footer">NFC Premium Business Card</div>
  </div>
