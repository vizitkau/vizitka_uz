<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azizov Akbar | NFC Card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#1b1b1b,#040404 65%);
  color:white; padding:28px;
}
.wrap{
  max-width:1100px; margin:auto;
  display:grid; grid-template-columns:1fr 1fr;
  gap:28px;
}
.hero,.panel{
  border:1px solid rgba(212,175,55,.35);
  border-radius:34px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(18px);
  box-shadow:0 30px 90px rgba(0,0,0,.65);
}
.hero{
  min-height:640px; padding:34px; position:relative; overflow:hidden;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.25),#050505 70%),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80") center/cover;
}
.badge{
  position:absolute;right:28px;top:28px;
  padding:10px 18px;border-radius:30px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(212,175,55,.55);
  color:#f3d36b;font-weight:700;
}
.logo{
  margin-top:135px;width:96px;height:96px;border-radius:26px;
  background:linear-gradient(135deg,#d4af37,#fff0a3);
  color:#111;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:900;
}
h1{font-size:58px;line-height:.95;margin:42px 0 12px}
h1 span{color:#d4af37}
.desc{color:#d7d7d7;font-size:18px;line-height:1.6}
.features{
  display:flex;gap:22px;margin:34px 0;color:#cfcfcf;flex-wrap:wrap;
}
.features i{color:#d4af37}
.phonebox{
  margin-top:30px;padding:18px;border-radius:22px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  display:flex;gap:16px;align-items:center;
}
.phonebox i{
  width:56px;height:56px;border-radius:16px;
  background:rgba(212,175,55,.15);color:#d4af37;
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.panel{
  padding:34px;display:flex;flex-direction:column;justify-content:center;
}
.btn{
  display:flex;align-items:center;gap:18px;
  padding:18px;margin:10px 0;border-radius:22px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.11);
  color:white;text-decoration:none;transition:.25s;font-weight:700;
}
.btn:hover{
  transform:translateY(-3px);
  border-color:#d4af37;
  background:rgba(255,255,255,.13);
}
.icon{
  width:58px;height:58px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;background:rgba(212,175,55,.16);color:#f3d36b;
}
.btn small{display:block;color:#aaa;margin-top:5px;font-weight:400}
.arrow{margin-left:auto;color:#999}
.gold{background:linear-gradient(135deg,rgba(212,175,55,.35),rgba(255,255,255,.08))}
.brand{
  margin-top:18px;
  text-align:center;
  color:#666;
  font-size:11px;
  letter-spacing:1px;
}
.brand a{
  display:inline-block;
  margin-top:4px;
  color:#888;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}
.brand i{color:#d4af37;font-size:12px}
button{font-family:inherit;cursor:pointer;text-align:left;width:100%}

@media(max-width:820px){
  body{padding:16px}
  .wrap{grid-template-columns:1fr;max-width:440px}
  .hero{min-height:560px;padding:26px}
  .logo{margin-top:110px;width:82px;height:82px;font-size:36px}
  h1{font-size:44px}
  .panel{padding:22px}
  .btn{padding:15px;border-radius:18px}
  .icon{width:50px;height:50px}
}
</style>
</head>

<body>
<main class="wrap">

<section class="hero">
  <div class="badge"><i class="fa-solid fa-wifi"></i> NFC CARD</div>
  <div class="logo">AA</div>

  <h1>Azizov<br><span>Akbar</span></h1>
  <div class="desc">Digital Business Card<br>Zamonaviy raqamli vizitka. Kontaktlaringiz bitta joyda.</div>

  <div class="features">
    <div><i class="fa-solid fa-shield-halved"></i> Ishonchlilik</div>
    <div><i class="fa-solid fa-bolt"></i> Tezkorlik</div>
    <div><i class="fa-solid fa-lock"></i> Xavfsizlik</div>
  </div>

  <div class="phonebox">
    <i class="fa-solid fa-phone"></i>
    <div>
      <b>+998 90 610 06 36</b><br>
      <span style="color:#aaa">Telefon raqamingiz</span>
    </div>
  </div>
</section>

<section class="panel">

  <a class="btn gold" href="tel:+998906100636">
    <div class="icon"><i class="fa-solid fa-phone"></i></div>
    <div>Qo‘ng‘iroq qilish<small>Bir marta bosish bilan</small></div>
    <i class="fa-solid fa-chevron-right arrow"></i>
  </a>

  <a class="btn" href="https://t.me/Akkbar611" target="_blank">
    <div class="icon"><i class="fa-brands fa-telegram"></i></div>
    <div>Telegram<small>Menga yozing</small></div>
    <i class="fa-solid fa-chevron-right arrow"></i>
  </a>

  <a class="btn" href="https://instagram.com/111_.cosmos" target="_blank">
    <div class="icon"><i class="fa-brands fa-instagram"></i></div>
    <div>Instagram<small>Profilimni ko‘rish</small></div>
    <i class="fa-solid fa-chevron-right arrow"></i>
  </a>

  <button class="btn" onclick="copyCard()">
    <div class="icon"><i class="fa-solid fa-credit-card"></i></div>
    <div>Karta raqamini nusxalash<small>Bir klikda nusxalash</small></div>
    <i class="fa-solid fa-chevron-right arrow"></i>
  </button>

  <button class="btn" onclick="saveContact()">
    <div class="icon"><i class="fa-solid fa-user-plus"></i></div>
    <div>Kontaktni saqlash<small>Telefoningizga saqlang</small></div>
    <i class="fa-solid fa-chevron-right arrow"></i>
  </button>

  <div class="brand">
    Made by
    <a href="https://instagram.com/vizitka_uz" target="_blank">
      <i class="fa-brands fa-instagram"></i> @vizitka_uz
    </a>
  </div>

</section>

</main>

<script>
function copyCard(){
  navigator.clipboard.writeText("5440810309065703");
  alert("Karta raqami nusxalandi");
}
function saveContact(){
  const vcard=`BEGIN:VCARD
VERSION:3.0
FN:Azizov Akbar
TEL:+998906100636
URL:https://instagram.com/111_.cosmos
END:VCARD`;
  const blob=new Blob([vcard],{type:"text/vcard"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="Azizov_Akbar.vcf";
  link.click();
}
</script>

</body>
</html>
