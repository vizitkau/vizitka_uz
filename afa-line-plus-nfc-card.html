<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akramov Abduqodir | AFA LINE PLUS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 0, 0, .22), transparent 35%),
        linear-gradient(135deg, #050505, #140000, #000);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .nfc-card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(18,18,18,.95), rgba(70,0,0,.65));
      border: 1px solid rgba(255, 215, 0, .45);
      box-shadow: 0 0 45px rgba(255, 0, 0, .28), inset 0 0 30px rgba(255, 215, 0, .06);
      position: relative;
      overflow: hidden;
    }

    .nfc-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(120deg, transparent, rgba(255,215,0,.5), transparent);
      transform: translateX(-100%);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      45%,100% { transform: translateX(100%); }
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(145deg, #d4af37, #7a0000);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(212,175,55,.5);
      font-size: 34px;
      font-weight: 900;
      color: #050505;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #fff, #ffd700, #ff3b3b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .company {
      text-align: center;
      color: #ffd36a;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .status {
      text-align: center;
      color: #ddd;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 15px 17px;
      margin-bottom: 12px;
      border-radius: 17px;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,215,0,.24);
      transition: .25s;
      backdrop-filter: blur(8px);
    }

    .contact-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(90deg, rgba(120,0,0,.95), rgba(212,175,55,.35));
      color: #fff;
      box-shadow: 0 8px 25px rgba(255,0,0,.25);
    }

    .contact-btn i {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd700, #a30000);
      color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .btn-text small {
      display: block;
      color: #cfcfcf;
      font-size: 12px;
    }

    .btn-text span {
      font-weight: 700;
      font-size: 15px;
    }

    .save-btn {
      margin-top: 18px;
      width: 100%;
      padding: 15px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(90deg, #9b0000, #ffd700);
      color: #050505;
      font-weight: 900;
      letter-spacing: .5px;
      box-shadow: 0 0 25px rgba(255,215,0,.35);
    }

    .made {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }

    .made a {
      color: #ffd700;
      text-decoration: none;
      font-weight: 700;
    }

    .gold-line {
      width: 70px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
      margin: 14px auto 22px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="nfc-card">
    <div class="content">
      <div class="logo">AFA</div>

      <h1>Akramov Abduqodir</h1>
      <div class="company">AFA LINE PLUS</div>
      <div class="status">Rasmiy diller</div>

      <div class="gold-line"></div>

      <a class="contact-btn" href="tel:+998997975001">
        <i class="fa-solid fa-phone"></i>
        <div class="btn-text">
          <small>Telefon</small>
          <span>+998 99 797 50 01</span>
        </div>
      </a>

      <a class="contact-btn" href="https://t.me/AAR655" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        <div class="btn-text">
          <small>Shaxsiy Telegram</small>
          <span>@AAR655</span>
        </div>
      </a>

      <a class="contact-btn" href="https://t.me/afa_line_plus" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        <div class="btn-text">
          <small>Kompaniya Telegram</small>
          <span>@afa_line_plus</span>
        </div>
      </a>

      <a class="contact-btn" href="https://instagram.com/AFALINEPLUS" target="_blank">
        <i class="fa-brands fa-instagram"></i>
        <div class="btn-text">
          <small>Instagram</small>
          <span>@AFALINEPLUS</span>
        </div>
      </a>

      <a class="contact-btn" href="https://www.youtube.com/@AFALINEPLUS" target="_blank">
        <i class="fa-brands fa-youtube"></i>
        <div class="btn-text">
          <small>YouTube</small>
          <span>@AFALINEPLUS</span>
        </div>
      </a>

      <button class="save-btn" onclick="saveContact()">
        <i class="fa-solid fa-address-card"></i> Kontaktni saqlash
      </button>

      <div class="made">
        made by:
        <a href="https://t.me/vizitka_uz" target="_blank">vizitka_uz</a>
      </div>
    </div>
  </div>

  <script>
    function saveContact() {
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Akramov Abduqodir
ORG:AFA LINE PLUS
TITLE:Rasmiy diller
TEL:+998997975001
URL:https://t.me/AAR655
URL:https://instagram.com/AFALINEPLUS
URL:https://www.youtube.com/@AFALINEPLUS
URL:https://t.me/afa_line_plus
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "Akramov-Abduqodir.vcf";
      a.click();

      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
