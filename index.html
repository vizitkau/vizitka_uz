<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
background:
radial-gradient(circle at top,#2f3748 0%,transparent 35%),
radial-gradient(circle at bottom left,#16203d 0%,transparent 30%),
#03050a;
}

body::before{
content:'';
position:fixed;
width:800px;
height:800px;
background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
top:-300px;
right:-300px;
filter:blur(100px);
}

.card{

width:100%;
max-width:460px;

padding:35px 25px;

border-radius:42px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.09),
rgba(255,255,255,.03)
);

backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 25px 80px rgba(0,0,0,.6),
0 0 40px rgba(255,255,255,.05);

position:relative;
overflow:hidden;

}

.logo-box{

width:180px;
height:180px;

margin:auto;

border-radius:50%;

padding:4px;

background:
linear-gradient(
135deg,
#ffffff,
#7f8897,
#ffffff
);

box-shadow:
0 0 50px rgba(255,255,255,.4),
0 0 120px rgba(255,255,255,.12);

animation:float 5s ease-in-out infinite;

}

.custom-logo{

width:100%;
height:100%;

border-radius:50%;

background:
radial-gradient(circle at 30% 20%,
#3b4354,
#0a0c12 60%);

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

position:relative;

}

.custom-logo::before{

content:'';

position:absolute;

width:200px;
height:200px;

background:
radial-gradient(circle,
rgba(255,255,255,.18),
transparent 65%);

filter:blur(20px);

}

.custom-logo span{

position:relative;

z-index:2;

font-size:120px;

font-weight:900;

font-family:Georgia,serif;

background:
linear-gradient(
135deg,
#ffffff,
#a8b0bf,
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 30px rgba(255,255,255,.6);

}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

}

h1{

margin-top:25px;

text-align:center;

font-size:42px;

font-weight:900;

letter-spacing:5px;

background:
linear-gradient(
90deg,
#ffffff,
#b7bfd1,
#ffffff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

text-align:center;

margin-top:8px;

color:#aeb7ca;

font-size:15px;

}

.hero{

margin-top:25px;

padding:22px;

border-radius:26px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.08),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.08);

text-align:center;

}

.hero small{

display:block;

margin-bottom:8px;

color:#b6bfd2;

}

.hero h2{

font-size:22px;

}

.links{

margin-top:22px;

display:flex;
flex-direction:column;
gap:14px;

}

.link{

text-decoration:none;

color:white;

padding:18px 20px;

border-radius:22px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.08),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.08);

display:flex;

justify-content:space-between;

align-items:center;

transition:.3s;

}

.link:hover{

transform:translateY(-4px);

box-shadow:
0 15px 35px rgba(255,255,255,.08);

}

.left strong{

display:block;

font-size:18px;

}

.left span{

display:block;

margin-top:4px;

font-size:14px;

color:#b3bdd0;

}

.icon{

font-size:22px;

}

.phone{

margin-top:20px;

padding:20px;

border-radius:24px;

text-align:center;

background:
linear-gradient(
135deg,
rgba(255,255,255,.12),
rgba(255,255,255,.04)
);

border:1px solid rgba(255,255,255,.08);

}

.phone h3{

margin-bottom:8px;

font-size:18px;

}

.phone a{

text-decoration:none;

color:white;

font-size:20px;

font-weight:700;

}

.footer{

margin-top:25px;

text-align:center;

font-size:12px;

letter-spacing:2px;

color:#798396;

}

</style>
</head>
