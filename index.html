<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIZITKA_UZ Premium NFC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#05070d;
overflow:hidden;
padding:20px;
}

body::before{
content:"";
position:fixed;
width:800px;
height:800px;
background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
top:-300px;
right:-250px;
filter:blur(120px);
}

body::after{
content:"";
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,rgba(0,102,255,.15),transparent 70%);
bottom:-250px;
left:-250px;
filter:blur(120px);
}

.card{

width:100%;
max-width:430px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.08);

border-radius:40px;

padding:35px 25px;

box-shadow:
0 0 50px rgba(255,255,255,.08),
0 30px 80px rgba(0,0,0,.6);

position:relative;

overflow:hidden;

}

.logo-wrap{

width:160px;
height:160px;

margin:auto;

border-radius:50%;

padding:4px;

background:
linear-gradient(
135deg,
#ffffff,
#6b7280,
#ffffff
);

box-shadow:
0 0 60px rgba(255,255,255,.45),
0 0 120px rgba(255,255,255,.15);

animation:float 4s ease-in-out infinite;

}

.logo{

width:100%;
height:100%;

border-radius:50%;

object-fit:cover;

display:block;

}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

}

h1{

margin-top:25px;

text-align:center;

font-size:42px;

font-weight:900;

letter-spacing:5px;

background:
linear-gradient(
90deg,
#fff,
#c7d2fe,
#fff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

text-align:center;

color:#a7b0c3;

margin-top:8px;

font-size:15px;

}

.nfc{

margin-top:25px;

padding:20px;

border-radius:28px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.08),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.08);

text-align:center;

}

.nfc small{

color:#b8c2d3;

display:block;

margin-bottom:8px;

}

.nfc h2{

font-size:18px;

color:white;

}

.links{

margin-top:22px;

display:flex;
flex-direction:column;
gap:14px;

}

.link{

text-decoration:none;

color:white;

padding:18px 20px;

border-radius:24px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.07),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.08);

display:flex;

justify-content:space-between;

align-items:center;

transition:.3s;

}

.link:hover{

transform:translateY(-3px);

box-shadow:
0 15px 40px rgba(255,255,255,.08);

}

.left strong{

display:block;

font-size:18px;

}

.left span{

color:#aab3c7;

font-size:14px;

}

.arrow{

font-size:24px;

opacity:.8;

}

.footer{

margin-top:30px;

text-align:center;

font-size:12px;

color:#7d8798;

}

</style>
</head>

<body>

<div class="card">

<div class="logo-wrap">
<img src="logo.png" class="logo">
</div>

<h1>VIZITKA_UZ</h1>

<p class="subtitle">
Premium NFC Digital Business Card
</p>

<div class="nfc">
<small>Telefonni kartaga tekkizing</small>
<h2>Kontaktlar bir zumda ochiladi</h2>
</div>

<div class="links">

<a class="link" href="https://instagram.com/vizitka_uz" target="_blank">
<div class="left">
<strong>Instagram</strong>
<span>@vizitka_uz</span>
</div>
<div class="arrow">↗</div>
</a>

<a class="link" href="https://t.me/web_567" target="_blank">
<div class="left">
<strong>Telegram</strong>
<span>@web_567</span>
</div>
<div class="arrow">↗</div>
</a>

<a class="link" href="https://pinterest.com/vizitka_uz" target="_blank">
<div class="left">
<strong>Pinterest</strong>
<span>@vizitka_uz</span>
</div>
<div class="arrow">↗</div>
</a>

<a class="link" href="tel:+998935675510">
<div class="left">
<strong>Telefon raqamim</strong>
<span>+998 93 567 55 10</span>
</div>
<div class="arrow">☎</div>
</a>

</div>

<div class="footer">
Made by VIZITKA_UZ
</div>

</div>

</body>
</html>
